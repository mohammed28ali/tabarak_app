name: tabark_innov8
description: "Tabark App"

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.5.3


dependencies:
  flutter:
    sdk: flutter



  cupertino_icons: ^1.0.8
  toast: ^0.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  flutter_bloc: ^8.1.6
  flutter_svg: ^2.0.10+1
  dartz: ^0.10.1
  get_it: ^8.0.1
  flutter_localization: ^0.2.2
  flutter_phosphor_icons: ^0.0.1+6
  dropdown_button2: ^2.3.9
  dio: ^5.7.0
  equatable: ^2.0.5
  awesome_dio_interceptor: ^1.2.0
  pinput: ^5.0.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  device_info_plus: ^11.1.0
  permission_handler: ^11.3.1
  location: ^7.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true

  assets:
   - assets/images/
   - assets/icons/
   - assets/font/

  fonts:
    - family: Hacen-Tunisia
      fonts:
        - asset: assets/font/Hacen-Tunisia-Lt.ttf

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
